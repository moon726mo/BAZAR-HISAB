<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>বাজার হিসাব</title>

<!-- PWA -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1B4332">
<meta name="background-color" content="#FBF6EA">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="বাজার হিসাব">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;700;800&family=Hind+Siliguri:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF6EA;
    --ink:#20301F;
    --green:#1B4332;
    --green-2:#2D6A4F;
    --mustard:#C89116;
    --mustard-light:#E8B93A;
    --brick:#A13D2E;
    --line:#D8CBA3;
    --shadow: rgba(27,67,50,0.18);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background: linear-gradient(160deg, #EFE9D6 0%, #E4DCC2 100%);
    font-family:'Hind Siliguri', sans-serif;
    color:var(--ink);
    padding:24px 16px calc(24px + env(safe-area-inset-bottom));
  }
  h1,h2,h3, .brand{ font-family:'Baloo Da 2', 'Hind Siliguri', sans-serif; }
  .wrap{ max-width:920px; margin:0 auto; }

  header.top{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:6px; margin-bottom:20px; position:relative; }
  .menu-btn{
    position:absolute; left:0; top:50%; transform:translateY(-50%); border:none; background:none;
    font-size:1.5rem; color:var(--green); cursor:pointer; padding:6px 8px; line-height:1;
  }
  .menu-btn:hover{ color:var(--green-2); }
  header.top .brand{ font-size:2.1rem; font-weight:800; color:var(--green); }
  header.top .brand span{ color:var(--mustard); }
  header.top .sub{ color:#5b6b58; font-size:0.92rem; }

  .bottom-nav{
    position:fixed; left:0; right:0; bottom:0; z-index:50;
    display:flex; justify-content:center;
    padding:0;
    pointer-events:none;
  }
  .bottom-nav-inner{
    pointer-events:auto;
    display:flex; align-items:stretch; gap:2px;
    width:100%; max-width:560px;
    background:#FEFDF9; border-radius:20px 20px 0 0;
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    box-shadow: 0 -6px 20px -10px rgba(27,67,50,0.35), 0 -2px 8px -2px rgba(27,67,50,0.12);
    border:1px solid rgba(27,67,50,0.05);
    border-bottom:none;
  }
  .navbtn{
    flex:1; border:none; background:transparent; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:3px; padding:8px 4px 7px; border-radius:14px;
    font-family:'Hind Siliguri', sans-serif; color:#8a9088; transition:all .15s;
  }
  .navbtn .navicon{ font-size:1.28rem; line-height:1; filter:grayscale(35%); opacity:0.85; }
  .navbtn .navlabel{ font-size:0.66rem; font-weight:600; line-height:1; white-space:nowrap; }
  .navbtn:active{ transform:scale(0.94); }
  .navbtn.active{ color:var(--green); background:#EAF3EC; }
  .navbtn.active .navicon{ filter:none; opacity:1; }

  .tabpage{ display:none; }
  .tabpage.active{ display:block; }

  .card{
    background:#fff; border-radius:16px; padding:20px 20px 22px;
    box-shadow: 0 10px 30px -14px var(--shadow);
    border:1px solid rgba(27,67,50,0.06);
  }
  .card h2{ margin:0 0 14px; font-size:1.15rem; color:var(--green); display:flex; align-items:center; gap:8px; }
  .card h2 .tag{
    font-family:'JetBrains Mono', monospace; font-size:0.65rem; font-weight:700;
    background:var(--green); color:#fff; padding:2px 8px; border-radius:20px; letter-spacing:0.5px;
  }

  label{ font-size:0.85rem; color:#4a564a; display:block; margin:10px 0 5px; font-weight:500; }
  input, select{
    width:100%; padding:10px 12px; border-radius:10px; border:1.5px solid var(--line);
    font-family:'Hind Siliguri', sans-serif; font-size:1rem; background:#FCFBF6; outline:none;
    transition:border-color .15s, background .15s;
  }
  input:focus, select:focus{ border-color:var(--green-2); background:#fff; }

  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  .btn{
    border:none; cursor:pointer; font-family:'Hind Siliguri', sans-serif; font-weight:600;
    border-radius:10px; padding:11px 16px; font-size:0.95rem; transition:transform .1s, filter .15s;
  }
  .btn:active{ transform:scale(0.97); }
  .btn-primary{ background:var(--green); color:#fff; }
  .btn-primary:hover{ filter:brightness(1.1); }
  .btn-ghost{ background:#F1EEE2; color:var(--ink); }
  .btn-ghost:hover{ background:#E7E2D2; }
  .btn-danger{ background:transparent; color:var(--brick); border:1.5px solid var(--brick); }
  .btn-danger:hover{ background:rgba(161,61,46,0.08); }
  .btn-full{ width:100%; margin-top:14px; }

  .plist{ margin-top:16px; }
  .plist-row{ border-bottom:1px dashed var(--line); }
  .plist-row:last-child{ border-bottom:none; }
  .plist-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 4px; font-size:0.92rem;
  }
  .trend-btn{
    background:none; border:none; cursor:pointer; font-size:0.95rem; padding:2px 4px;
    border-radius:6px; opacity:0.75; transition:opacity .15s, background .15s;
  }
  .trend-btn:hover{ opacity:1; background:rgba(200,145,22,0.14); }
  .trend-panel{
    background:#FBF8EE; border-radius:10px; padding:14px 16px; margin:0 4px 12px;
    border:1px solid var(--line);
  }
  .trend-chart-svg{ min-height:200px; }
  @media (max-width:420px){
    .trend-chart-svg{ min-height:230px; }
  }
  .trend-summary{ display:flex; justify-content:space-between; font-size:0.8rem; color:#5b6b58; margin-top:8px; }
  .trend-summary .up{ color:var(--brick); font-weight:700; }
  .trend-summary .down{ color:var(--green-2); font-weight:700; }
  .trend-pct-up{ color:var(--brick); font-weight:700; font-size:0.78rem; white-space:nowrap; }
  .trend-pct-down{ color:var(--green-2); font-weight:700; font-size:0.78rem; white-space:nowrap; }
  .trend-pct-flat{ color:#7a8a76; font-weight:600; font-size:0.78rem; white-space:nowrap; }

  .trend-chip-row{
    display:flex; flex-wrap:nowrap; overflow-x:auto; gap:8px;
    padding:2px 2px 8px; margin:0 0 10px;
    scrollbar-width:thin; -webkit-overflow-scrolling:touch;
  }
  .trend-chip-row .cat-chip{ flex:0 0 auto; }
  .trend-chip-row::-webkit-scrollbar{ height:5px; }
  .trend-chip-row::-webkit-scrollbar-thumb{ background:var(--line); border-radius:10px; }


  .mover-cards{ display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:10px; margin:0 0 14px; }
  .mover-card{
    border:1.5px solid var(--line); background:#FCFBF6; border-radius:14px;
    padding:10px 12px; cursor:pointer; transition:all .15s; text-align:left;
  }
  .mover-card:hover{ border-color:var(--mustard); box-shadow:0 2px 8px var(--shadow); transform:translateY(-1px); }
  .mover-card .mover-fire{ font-size:0.95rem; }
  .mover-card .mover-nm{ font-weight:700; font-size:0.88rem; color:var(--ink); display:block; margin:4px 0 3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mover-card .mover-pct{ font-weight:800; font-size:0.95rem; }
  .mover-card .mover-pct.up{ color:var(--brick); }
  .mover-card .mover-pct.down{ color:var(--green-2); }
  .mover-card .mover-price{ font-size:0.72rem; color:#7a8a76; margin-top:2px; font-family:'JetBrains Mono', monospace; }
  .plist-item .nm{ font-weight:600; }
  .plist-item .pr{ font-family:'JetBrains Mono', monospace; color:var(--green-2); font-size:0.85rem; cursor:pointer; border-bottom:1px dashed var(--green-2); padding:2px 3px; border-radius:4px; }
  .plist-item .pr:hover{ background:rgba(45,106,79,0.1); }
  .plist-item .pr-edit{ width:80px; padding:5px 7px; font-family:'JetBrains Mono', monospace; font-size:0.85rem; border-radius:6px; }
  .plist-item button{ background:none; border:none; color:var(--brick); cursor:pointer; font-size:0.9rem; }
  .empty-note{ color:#9a9a86; font-style:italic; padding:14px 4px; }
  .history-entry{
    border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:10px; background:#fff;
  }
  .history-entry summary{
    display:flex; justify-content:space-between; align-items:center; cursor:pointer;
    list-style:none; font-weight:600;
  }
  .history-entry summary::-webkit-details-marker{ display:none; }
  .history-entry .hist-date{ color:var(--ink); }
  .history-entry .hist-total{ font-family:'JetBrains Mono', monospace; color:var(--green-2); }
  .hist-body{ margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); }
  .hist-cat{ font-weight:700; color:var(--green); margin:6px 0 2px; }
  .hist-item{ display:flex; justify-content:space-between; padding:3px 0; font-size:0.92rem; }
  .hist-cat-total{ text-align:right; font-size:0.85rem; color:#5b6b58; margin-top:2px; }

  .cat-chips{ display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 4px; }
  .cat-chip{
    border:1.5px solid var(--line); background:#FCFBF6; color:#4a564a;
    padding:7px 14px; border-radius:20px; font-size:0.85rem; font-weight:600;
    cursor:pointer; transition:all .15s;
  }
  .cat-chip.active{ background:var(--mustard); border-color:var(--mustard); color:#fff; }
  .cat-chip:hover{ border-color:var(--green-2); }
  .cat-chip-add{
    border-style:dashed; color:var(--green-2); font-weight:800; padding:7px 16px;
  }
  .cat-chip-add:hover{ background:var(--green-2); border-color:var(--green-2); color:#fff; }

  .item-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:12px; margin-top:16px; }
  .item-card{
    border:1.8px solid var(--line); border-radius:14px; padding:14px; background:#FCFBF6;
    cursor:pointer; transition:border-color .15s, background .15s;
  }
  .item-card.selected{ border-color:var(--green-2); background:#EAF3EC; }
  .item-card .nm{ font-weight:700; font-size:1rem; color:var(--ink); }
  .item-card .meta{ font-size:0.78rem; color:#7a8a76; margin:2px 0 10px; }
  .item-card input{ padding:8px 10px; font-family:'JetBrains Mono', monospace; }
  .item-card .sub{ margin-top:8px; font-size:0.82rem; color:var(--green-2); font-weight:600; min-height:1.2em; }

  .receipt-shell{
    background:var(--paper); border-radius:14px; margin-top:22px;
    box-shadow: 0 14px 34px -16px var(--shadow); padding:20px 22px;
  }
  .receipt-head{ display:flex; justify-content:space-between; align-items:baseline; border-bottom:2px dashed var(--line); padding-bottom:12px; margin-bottom:4px; }
  .receipt-head .store{ font-family:'Baloo Da 2'; font-size:1.2rem; color:var(--green); font-weight:700; }
  .receipt-head .date{ font-family:'JetBrains Mono', monospace; font-size:0.72rem; color:#7a7a68; }

  .cart-list{ margin-top:6px; }
  .cart-empty{ text-align:center; color:#9a9a86; font-style:italic; padding:20px 4px; }
  .cart-cat-head{
    font-family:'Baloo Da 2', 'Hind Siliguri', sans-serif; font-weight:700; font-size:0.88rem;
    color:var(--green); padding:12px 2px 6px; border-bottom:1.5px solid var(--green-2); margin-top:6px;
  }
  .cart-cat-head:first-child{ margin-top:0; padding-top:2px; }
  .cart-item{ padding:10px 2px; border-bottom:1px dashed var(--line); }
  .cart-item-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .cart-item-name{ font-weight:600; font-size:0.92rem; color:var(--ink); word-break:break-word; }
  .cart-item-meta{
    display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 14px; margin-top:5px;
    font-family:'JetBrains Mono', monospace; font-size:0.82rem; color:#5b6b58;
  }
  .cart-item-meta .qty{ white-space:nowrap; }
  .cart-item-meta .price{ white-space:nowrap; color:#7a8a76; }
  .cart-item-meta .sub{ white-space:nowrap; color:var(--green-2); font-weight:700; margin-left:auto; }
  .cart-cat-subtotal{
    padding:7px 2px 14px; font-size:0.8rem; font-weight:600; color:#5b6b58;
    font-style:italic; display:flex; justify-content:space-between;
  }
  .cart-cat-subtotal .val{ font-style:normal; color:var(--mustard); font-family:'JetBrains Mono', monospace; font-size:0.85rem; }
  .del-btn{ background:none; border:none; color:var(--brick); cursor:pointer; font-size:1rem; line-height:1; padding:2px 6px; border-radius:6px; flex-shrink:0; }
  .del-btn:hover{ background:rgba(161,61,46,0.12); }

  .grand{
    display:flex; justify-content:space-between; align-items:center; margin-top:14px;
    padding:14px 16px; background:var(--green); color:#fff; border-radius:12px;
  }
  .grand .lbl{ font-family:'Baloo Da 2'; font-size:1rem; }
  .grand .val{ font-family:'JetBrains Mono', monospace; font-size:1.5rem; font-weight:700; color:var(--mustard-light); }

  .actions-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px; }
  .actions-row .btn{ min-width:0; }
  @media (min-width:480px){
    .actions-row{ grid-template-columns:repeat(3, 1fr); }
  }

  @media print{
    .bottom-nav, header.top, .item-grid, .actions-row{ display:none !important; }
  }

  .sync-toast{
    position:fixed; top:14px; left:50%; transform:translateX(-50%) translateY(-8px);
    display:flex; align-items:center; gap:10px; z-index:100;
    background:#2A3A28; border-radius:20px; padding:8px 16px;
    box-shadow:0 10px 24px -10px rgba(0,0,0,0.35);
    opacity:0; pointer-events:none; transition:opacity .3s ease, transform .3s ease;
  }
  .sync-toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .sync-status{ font-size:0.8rem; color:#fff; font-weight:500; }
  .sync-status.ok{ color:#8FDBB0; }
  .sync-status.err{ color:#F0A08E; }
  .sync-status.busy{ color:var(--mustard-light); }
  .search-select{ position:relative; }

  .item-picker-btn{
    width:100%; display:flex; align-items:center; justify-content:space-between;
    padding:11px 14px; border-radius:10px; border:1.5px solid var(--line);
    background:#FCFBF6; font-family:'Hind Siliguri', sans-serif; font-size:1rem;
    color:#8a9088; cursor:pointer; text-align:left; transition:border-color .15s;
  }
  .item-picker-btn:hover{ border-color:var(--green-2); }
  .item-picker-btn .ipb-label.chosen{ color:var(--ink); font-weight:600; }
  .item-picker-btn.chosen{ color:var(--ink); font-weight:600; }
  .qty-unit-box{
    display:flex; align-items:center; gap:6px;
    border:1.5px solid var(--line); border-radius:10px; background:#FCFBF6;
    padding:0 12px;
  }
  .qty-unit-box input{
    border:none; background:transparent; outline:none; width:100%;
    padding:11px 0; font-family:'Hind Siliguri', sans-serif; font-size:1rem; color:var(--ink);
  }
  .qty-unit-box span{ color:#8a9088; font-size:0.85rem; white-space:nowrap; }
  .qty-unit-box span.chosen{ color:var(--ink); font-weight:600; }
  .qty-unit-box span.toggleable{
    cursor:pointer; border-bottom:1.5px dashed var(--green-2); padding-bottom:1px;
  }
  .qty-unit-box span.toggleable:hover{ color:var(--green-2); }
  .item-picker-btn .ipb-arrow{ color:#8a9088; font-size:0.8rem; margin-left:8px; }

  body.no-scroll{ overflow:hidden; }

  .picker-overlay{
    display:none; position:fixed; inset:0; background:rgba(20,30,20,0.45);
    z-index:200; align-items:flex-start; justify-content:center;
    padding-top:env(safe-area-inset-top);
  }
  .picker-overlay.open{ display:flex; }
  .picker-sheet{
    background:#FBF6EA; width:100%; max-width:560px; border-radius:0 0 20px 20px;
    max-height:78vh; display:flex; flex-direction:column; position:relative;
    box-shadow:0 10px 30px rgba(0,0,0,0.25);
    animation: sheetDown .08s ease;
  }
  @keyframes sheetDown{ from{ transform:translateY(-18px); opacity:0.7; } to{ transform:translateY(0); opacity:1; } }
  .picker-head{ display:flex; align-items:center; justify-content:space-between; padding:14px 46px 8px 16px; }
  .picker-title{ font-family:'Baloo Da 2'; font-weight:700; color:var(--green); font-size:1.05rem; }
  .picker-close{
    border:none; background:#F1EEE2; color:var(--ink); width:30px; height:30px;
    border-radius:50%; cursor:pointer; font-size:0.95rem; line-height:1;
    position:absolute; top:14px; right:16px; z-index:5;
  }
  .picker-close:hover{ background:#E7E2D2; }
  .picker-search-wrap{ padding:4px 16px 10px; }
  .picker-search{
    width:100%; padding:11px 14px; border-radius:12px; border:1.5px solid var(--line);
    font-family:'Hind Siliguri', sans-serif; font-size:1rem; background:#fff; outline:none;
  }
  .picker-search:focus{ border-color:var(--green-2); }
  .picker-list{ overflow-y:auto; padding:2px 10px calc(16px + env(safe-area-inset-bottom)); flex:1; }
  .picker-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 8px; border-radius:12px; cursor:pointer; gap:10px;
    border-bottom:1px dashed var(--line); position:relative;
  }
  .picker-item:last-child{ border-bottom:none; }
  .picker-item:active, .picker-item:hover{ background:#F1EEE2; }
  .picker-item.selected{ background:#EAF3EC; }
  .picker-item .nm{ font-weight:600; color:var(--ink); }
  .picker-item .pr{ font-family:'JetBrains Mono', monospace; color:var(--green-2); font-size:0.82rem; white-space:nowrap; }
  .picker-item .pr-unit{ font-size:0.82rem; color:#7a8a76; white-space:nowrap; border-bottom:1px dashed #7a8a76; padding:2px 3px; border-radius:4px; }
  .picker-item .pr-unit:hover{ background:rgba(45,106,79,0.08); }
  .picker-item .pr{ cursor:pointer; border-bottom:1px dashed var(--green-2); padding:2px 3px; border-radius:4px; }
  .picker-item .pr:hover{ background:rgba(45,106,79,0.1); }
  .picker-item .pr-view-row{ display:flex; align-items:center; gap:6px; }
  .picker-item .pr-unit-view{ font-size:0.82rem; color:#7a8a76; white-space:nowrap; }
  .picker-item .pr-view{ font-family:'JetBrains Mono', monospace; color:var(--green-2); font-size:0.82rem; white-space:nowrap; }
  .picker-item .pr-edit{ width:74px; padding:5px 7px; font-family:'JetBrains Mono', monospace; font-size:0.82rem; border-radius:6px; }
  .picker-item .pr-edit-unit{ width:auto; flex:0 0 auto; padding:5px 6px; font-size:0.82rem; border-radius:6px; font-family:'Hind Siliguri', sans-serif; }
  .cat-del-btn{ background:none; border:none; color:var(--brick); font-size:1rem; cursor:pointer; padding:4px 6px; line-height:1; flex-shrink:0; }
  .cat-del-btn:hover{ opacity:0.7; }
  .picker-dots-btn{
    background:none; border:none; color:#7a8a76; font-size:1.3rem; cursor:pointer;
    padding:6px 12px; line-height:1; flex-shrink:0; border-radius:8px;
  }
  .picker-dots-btn:hover, .picker-dots-btn:active{ background:#F1EEE2; color:var(--ink); }
  .picker-item-menu{
    display:flex; align-items:center; gap:6px; margin-top:2px;
    background:#F1EEE2; border-radius:8px; padding:8px 10px;
  }
  .picker-item-menu .pr-unit, .picker-item-menu .pr{ font-size:1rem; padding:4px 6px; }

  .item-menu-popup{
    position:fixed; background:#fff; border-radius:12px; width:190px; box-sizing:border-box;
    box-shadow:0 12px 34px rgba(0,0,0,0.28); border:1px solid rgba(27,67,50,0.08);
    z-index:400; overflow:hidden; padding:8px;
  }
  .item-menu-popup .menu-row{
    display:grid; grid-template-columns:1fr 96px; align-items:center; gap:8px;
    padding:12px 14px; cursor:pointer; font-size:0.88rem; color:var(--ink);
    border:1px solid var(--line); border-radius:8px; margin-bottom:8px;
    box-sizing:border-box; width:100%; overflow:hidden;
  }
  .item-menu-popup .menu-row:last-child{ margin-bottom:0; }
  .item-menu-popup .menu-row:active, .item-menu-popup .menu-row:hover{ background:#F1EEE2; }
  .item-menu-popup .menu-row.danger{ color:var(--brick); font-weight:600; justify-content:flex-start; }
  .item-menu-popup .menu-label{ color:#7a8a76; font-size:0.8rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .item-menu-popup .menu-value{
    font-family:'JetBrains Mono', monospace; color:var(--green-2); font-weight:600;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:right;
  }
  .item-menu-split{ display:flex; gap:8px; margin-bottom:0; }
  .item-menu-split .split-btn{
    flex:1; display:flex; align-items:center; justify-content:center;
    padding:12px 10px; cursor:pointer; font-size:0.88rem;
    border:1px solid var(--line); border-radius:8px;
  }
  .item-menu-split .split-btn:active, .item-menu-split .split-btn:hover{ background:#F1EEE2; }
  .item-menu-split .split-btn.danger{ color:var(--brick); font-weight:600; }
  .item-menu-split .split-btn.save{ color:var(--green-2); font-weight:600; }
  .item-menu-popup select.pr-edit-unit, .item-menu-popup input.pr-edit{
    margin:0; width:100%; max-width:100%; min-width:0; box-sizing:border-box;
    padding:5px 6px; font-size:0.8rem; border-radius:6px;
  }
  .picker-none{ padding:24px 16px; text-align:center; color:#9a9a86; font-style:italic; }
  #itemPickerModal.picker-overlay{ align-items:stretch; padding-top:0; }
  #itemPickerModal .picker-sheet{ max-height:100vh; max-height:100dvh; height:100vh; height:100dvh; border-radius:0; }
  #itemPickerModal .picker-list{ flex:1 1 auto; }
  #categoryPickerModal.picker-overlay{ align-items:stretch; padding-top:0; }
  #categoryPickerModal .picker-sheet{ max-height:100vh; max-height:100dvh; height:100vh; height:100dvh; border-radius:0; }
  #categoryPickerModal .picker-list{ flex:1 1 auto; }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <button type="button" class="menu-btn" id="headerSyncBtn" onclick="openSyncSettings()" aria-label="সিঙ্ক">⚙️</button>
    <div class="brand">🧺 বাজার <span>হিসাব</span></div>
  </header>

  <div id="syncBar" class="sync-toast">
    <span id="syncStatus" class="sync-status">🔌 সিঙ্ক সেট করা নেই</span>
  </div>

  <!-- TAB 2: Shopping -->
  <div class="tabpage active" id="tabPage2">
    <div class="card">
      <div style="display:flex; gap:8px; align-items:stretch;">
        <button type="button" id="selectItemBtn" class="item-picker-btn" style="width:auto; flex:1 1 0;" onclick="openItemPicker()">
          <span id="selectItemBtnLabel" class="ipb-label">জিনিস সিলেক্ট করুন</span>
          <span class="ipb-arrow">▾</span>
        </button>
        <div class="qty-unit-box" style="flex:1 1 0;">
          <input type="number" id="selectQty" min="0" step="0.01" placeholder="যেমন: 5">
          <span id="selectUnitBadge" onclick="toggleSelectQtyUnit()">একক</span>
        </div>
      </div>

      <div style="display:flex; gap:8px; align-items:stretch; margin-top:10px;">
        <input type="text" id="otherItemInput" placeholder="অন্যান্য" style="flex:1 1 0; width:50%;">
        <button class="btn btn-primary" style="flex:1 1 0; width:50%;" onclick="addSelectedItem()">➕ যোগ করো</button>
      </div>

      <div id="selectPreview" class="empty-note" style="display:none; margin-top:4px;"></div>

      <div id="shopEmptyNote" class="empty-note" style="display:none;">
        এখনো কোনো জিনিস সেভ করা নেই। আগে "প্রাইস লিস্ট" ট্যাবে গিয়ে জিনিস যোগ করুন।
      </div>
    </div>

    <div class="receipt-shell">
      <div class="receipt-head">
        <div class="store">আজকের বাজার</div>
        <div class="date" id="todayDate"></div>
      </div>
      <div class="cart-list" id="summaryBody">
        <div class="cart-empty">এখনো কিছু যোগ করা হয়নি</div>
      </div>
      <div class="grand">
        <div class="lbl">সর্বমোট খরচ<div id="grandOtherNote" style="display:none; font-size:0.68rem; font-weight:400; color:#9a9a86; margin-top:2px;">*অন্যান্য বাদে</div></div>
        <div class="val">৳ <span id="grandTotal">0.00</span></div>
      </div>
      <div class="actions-row">
        <button class="btn btn-ghost" id="copyWithPriceBtn" onclick="copySummary()">📋 কপি (দামসহ)</button>
        <button class="btn btn-ghost" id="copyNoPriceBtn" onclick="copyNameQtyOnly()">📝 কপি (দামছাড়া)</button>
        <button class="btn btn-ghost" onclick="window.print()">🖨️ প্রিন্ট / PDF</button>
        <button class="btn btn-ghost" onclick="switchTab(3)">🕘 হিস্টরি</button>
        <button class="btn btn-ghost" onclick="switchTab(4)">📈 প্রাইস ট্রেন্ড</button>
        <button class="btn btn-danger" onclick="clearQuantities()">🗑️ ক্লিয়ার</button>
      </div>
    </div>
  </div>

  <!-- TAB 3: History -->
  <div class="tabpage" id="tabPage3">
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <div style="display:flex; align-items:center; gap:6px;">
          <button type="button" class="picker-close" style="position:static;" onclick="switchTab(2)" aria-label="ফিরে যান">←</button>
          <div class="picker-title">🕘 বাজার হিস্টরি</div>
        </div>
        <button type="button" class="btn btn-ghost" onclick="clearAllHistory()">🗑️ সব মুছুন</button>
      </div>
      <div id="historyListBox"></div>
    </div>
  </div>

  <!-- TAB 4: Price Trend -->
  <div class="tabpage" id="tabPage4">
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <div style="display:flex; align-items:center; gap:6px;">
          <button type="button" class="picker-close" style="position:static;" onclick="switchTab(2)" aria-label="ফিরে যান">←</button>
          <div class="picker-title">📈 প্রাইস ট্রেন্ড</div>
        </div>
      </div>
      <div id="trendTopMoversBox"></div>
      <div class="trend-chip-row" id="trendCatChips"></div>
      <div class="trend-chip-row" id="trendSortChips"></div>
      <div class="trend-chip-row" id="trendRangeChips"></div>
      <div class="picker-search-wrap" style="padding:0 0 10px;">
        <input type="text" id="trendSearchInput" class="picker-search" autocomplete="off"
          placeholder="জিনিসের নাম দিয়ে খুঁজুন..." oninput="renderTrendList()">
      </div>
      <div id="trendListBox"></div>
    </div>
  </div>

</div>

<div id="itemPickerModal" class="picker-overlay" onclick="if(event.target===this) closeItemPicker()">
  <div class="picker-sheet">
    <div class="picker-head">
      <div class="cat-chips" id="itemPickerCatChips" style="margin:0; flex:1;"></div>
      <button type="button" class="picker-close" onclick="closeItemPicker()">✕</button>
    </div>
    <div class="picker-search-wrap" style="display:flex; gap:8px;">
      <input type="text" id="pickerSearchInput" class="picker-search" autocomplete="off"
        placeholder="জিনিসের নাম লিখুন..." style="flex:1;" oninput="renderPickerList()">
      <button type="button" id="pickerSaveBtn" class="btn btn-primary" style="flex-shrink:0;" onclick="saveNewItemFromPicker()">সেভ</button>
    </div>
    <div class="row2" style="margin:0 16px 10px;">
      <div>
        <select id="pickerNewItemUnit">
          <option value="কেজি">কেজি (kg)</option>
          <option value="লিটার">লিটার (litre)</option>
          <option value="পিস">পিস (piece)</option>
          <option value="ডজন">ডজন (dozen)</option>
          <option value="গ্রাম">গ্রাম (gram)</option>
          <option value="প্যাকেট">প্যাকেট (packet)</option>
          <option value="পাতা">পাতা (page)</option>
          <option value="টাকা">টাকা (taka)</option>
        </select>
      </div>
      <div>
        <input type="number" id="pickerNewItemPrice" min="0" step="0.01" placeholder="প্রতি একক দাম (৳)">
      </div>
    </div>
    <div id="pickerList" class="picker-list"></div>
  </div>
</div>

<div id="pickerItemMenuPopup" class="item-menu-popup" style="display:none;" onclick="event.stopPropagation()"></div>

<div id="categoryPickerModal" class="picker-overlay" onclick="if(event.target===this) closeCategoryPicker()">
  <div class="picker-sheet">
    <div class="picker-head">
      <div class="picker-title">ক্যাটাগরি সিলেক্ট করুন</div>
      <button type="button" class="picker-close" onclick="closeCategoryPicker()">✕</button>
    </div>
    <div class="picker-search-wrap" style="display:flex; gap:8px;">
      <input type="text" id="newCategoryInput" class="picker-search" autocomplete="off"
        placeholder="নতুন ক্যাটাগরির নাম লিখুন..." style="flex:1;">
      <button type="button" class="btn btn-primary" style="flex-shrink:0;" onclick="saveNewCategory()">সেভ</button>
    </div>
    <div id="categoryPickerList" class="picker-list"></div>
  </div>
</div>

<script>
  const PRICE_KEY = 'bazarHisab_priceList_v2';
  const HISTORY_KEY = 'bazarHisab_priceHistory_v1';
  const CATEGORY_KEY = 'bazarHisab_categoryList_v1';
  const SHOP_LOG_KEY = 'bazarHisab_shoppingLog_v1';
  const DEFAULT_CAT = 'সাধারণ';
  let priceList = JSON.parse(localStorage.getItem(PRICE_KEY) || '{}'); // { name: {unit, price, category} }
  let priceHistory = JSON.parse(localStorage.getItem(HISTORY_KEY) || '{}'); // { name: [{date:'YYYY-MM-DD', price}] }
  let customCategories = JSON.parse(localStorage.getItem(CATEGORY_KEY) || '[]'); // category names saved even before any item uses them
  let shoppingLog = JSON.parse(localStorage.getItem(SHOP_LOG_KEY) || '[]'); // [{id, dateLabel, grand, categories:[{category, catTotal, items:[{name,qty,unit,price,sub}]}]}]
  let quantities = {}; // { name: qty } -- current selection in the shopping tab
  let otherItems = []; // [{id, text}] -- free-text "অন্যান্য" entries in the shopping tab
  let pickerOpenMenuKey = null; // name of item whose ⋮ menu (একক/দাম/মুছুন) is open in the item picker
  let pickerMenuBtnEl = null; // the ⋮ button element the popup is anchored to
  let priceFilterCat = 'সব';
  let trendFilterCat = 'সব';
  let trendSortMode = 'name'; // 'name' | 'up' | 'down'
  let trendTimeRange = 'all'; // 'all' | '30' | '90'
  let shopFilterCat = 'সব';
  let selectedItemCategory = ''; // category chosen in the "নতুন জিনিস যোগ করুন" form, via the category picker
  let categoryPickerFromShop = false; // true when the category picker was opened from the বাজার করুন item-picker's + button

  /* ---------- Google Sheet auto-sync (two-way) ---------- */
  const SCRIPT_URL_KEY = 'bazarHisab_scriptUrl_v1';
  let scriptUrl = localStorage.getItem(SCRIPT_URL_KEY) || '';
  let pushTimer = null;
  let isPulling = false;
  let isPushing = false;
  let syncToastTimer = null;

  function setSyncStatus(text, kind){
    const bar = document.getElementById('syncBar');
    const el = document.getElementById('syncStatus');
    if (!el || !bar) return;
    el.textContent = text;
    el.className = 'sync-status' + (kind ? (' ' + kind) : '');
    bar.classList.add('show');
    if (syncToastTimer) clearTimeout(syncToastTimer);
    syncToastTimer = setTimeout(() => bar.classList.remove('show'), 2200);
  }

  // ইন্টারনেট চলে গেলে/ফিরে আসলে — অ্যাপ সবসময় localStorage থেকেই অফলাইনে কাজ করে;
  // এখানে শুধু নেট ফিরলে পেন্ডিং পরিবর্তন (যদি sync চালু থাকে) অটো পুশ করা হয়।
  window.addEventListener('online', () => {
    if (scriptUrl){
      setSyncStatus('🌐 ইন্টারনেট ফিরেছে, সিঙ্ক হচ্ছে...', 'busy');
      pushToSheet();
    }
  });
  window.addEventListener('offline', () => {
    setSyncStatus('📴 অফলাইন — সব পরিবর্তন এখনো এখানেই সেভ হচ্ছে, নেট ফিরলে অটো সিঙ্ক হবে', 'err');
  });

  function openSyncSettings(){
    const current = scriptUrl || '';
    const entered = prompt('Paste URL:', current);
    if (entered === null) return; // cancelled
    scriptUrl = entered.trim();
    localStorage.setItem(SCRIPT_URL_KEY, scriptUrl);
    if (!scriptUrl){
      setSyncStatus('🔌 সিঙ্ক সেট করা নেই', '');
      return;
    }
    pullFromSheet(true);
  }

  async function pullFromSheet(showAlertOnError){
    if (!scriptUrl || isPulling) return;
    if (!navigator.onLine){
      setSyncStatus('📴 অফলাইন — নেট আসলে আবার চেষ্টা করবে', 'err');
      return;
    }
    isPulling = true;
    setSyncStatus('⬇️ শিট থেকে আনা হচ্ছে...', 'busy');
    try {
      const res = await fetch(scriptUrl + '?action=getAll');
      const data = await res.json();
      if (data.error) throw new Error(data.error);

      const incomingList = data.priceList || {};
      const incomingHistory = data.priceHistory || {};
      const incomingShoppingLog = data.shoppingLog || [];

      // Sheet is treated as the source of truth on open, so app matches
      // whatever is currently in the sheet (empty sheet clears local list too,
      // since the same sheet may also be edited from another device).
      priceList = incomingList;
      priceHistory = incomingHistory;
      shoppingLog = incomingShoppingLog;
      savePriceList();
      savePriceHistory();
      saveShoppingLog();

      renderPriceList();
      renderSelectDropdown();
      renderSummary();
      renderHistoryList();

      setSyncStatus('✅ সিঙ্ক করা আছে', 'ok');
    } catch (err) {
      console.error('Pull sync failed:', err);
      setSyncStatus('❌ সিঙ্ক এরর (শিট থেকে আনতে পারেনি)', 'err');
      if (showAlertOnError) alert('শিট থেকে ডেটা আনতে সমস্যা হয়েছে। URL এবং Apps Script ডিপ্লয়মেন্ট চেক করো।\n\n' + err.message);
    } finally {
      isPulling = false;
    }
  }

  function queuePushToSheet(){
    if (!scriptUrl) return;
    if (!navigator.onLine){
      setSyncStatus('📴 অফলাইনে সেভ হয়েছে, নেট ফিরলে অটো সিঙ্ক হবে', 'err');
      return; // নেট ফিরলে 'online' ইভেন্ট লিসেনার নিজে থেকেই pushToSheet() চালাবে
    }
    setSyncStatus('✏️ পরিবর্তন হয়েছে, সিঙ্ক হবে...', 'busy');
    if (pushTimer) clearTimeout(pushTimer);
    pushTimer = setTimeout(pushToSheet, 900);
  }

  async function pushToSheet(){
    if (!scriptUrl || isPushing) return;
    isPushing = true;
    setSyncStatus('⬆️ শিটে পাঠানো হচ্ছে...', 'busy');
    try {
      // text/plain avoids a CORS preflight, which Apps Script web apps can't handle
      const res = await fetch(scriptUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'syncAll',
          priceList: priceList,
          priceHistory: priceHistory,
          shoppingLog: shoppingLog
        })
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      setSyncStatus('✅ সিঙ্ক করা আছে', 'ok');
    } catch (err) {
      console.error('Push sync failed:', err);
      setSyncStatus('❌ সিঙ্ক এরর (শিটে পাঠাতে পারেনি)', 'err');
    } finally {
      isPushing = false;
    }
  }

  function savePriceHistory(){
    localStorage.setItem(HISTORY_KEY, JSON.stringify(priceHistory));
  }

  function todayISO(){
    const d = new Date();
    return d.toISOString().slice(0,10);
  }

  function nowTimeLabel(){
    const d = new Date();
    return d.toLocaleTimeString('bn-BD', { hour:'2-digit', minute:'2-digit' });
  }

  function recordPriceHistory(name, price){
    if (!priceHistory[name]) priceHistory[name] = [];
    const hist = priceHistory[name];
    const last = hist[hist.length - 1];
    if (last && last.price === price) return; // price didn't actually change, skip duplicate point
    const today = todayISO();
    if (last && last.date === today){
      // another change on the same day: keep it as its own point (don't overwrite), tag with time so it's distinguishable
      hist.push({ date: today, time: nowTimeLabel(), price });
    } else {
      hist.push({ date: today, price });
    }
    savePriceHistory();
  }

  // Migrate any older items saved without a category, and seed price history
  Object.keys(priceList).forEach(k => {
    if (!priceList[k].category) priceList[k].category = DEFAULT_CAT;
    if (!priceHistory[k] || priceHistory[k].length === 0){
      priceHistory[k] = [{ date: todayISO(), price: priceList[k].price }];
    }
  });
  savePriceHistory();

  document.getElementById('todayDate').textContent = new Date().toLocaleDateString('bn-BD', {
    year:'numeric', month:'long', day:'numeric'
  });

  function fmt(n){
    return Number(n).toLocaleString('en-IN', { minimumFractionDigits:2, maximumFractionDigits:2 });
  }
  // যদি একক কেজি হয় আর পরিমাণ ১ কেজির কম হয়, তাহলে গ্রামে দেখায় (যেমন 0.5 → 500 গ্রাম)
  function getDisplayQtyUnit(qty, unit){
    if (unit === 'কেজি' && qty > 0 && qty < 1){
      return { qty: Math.round(qty * 1000), unit: 'গ্রাম' };
    }
    return { qty, unit };
  }
  function savePriceList(){
    localStorage.setItem(PRICE_KEY, JSON.stringify(priceList));
  }
  function saveCategoryList(){
    localStorage.setItem(CATEGORY_KEY, JSON.stringify(customCategories));
  }
  function getCategories(){
    const set = new Set([
      ...Object.values(priceList).map(it => it.category || DEFAULT_CAT),
      ...customCategories
    ]);
    return Array.from(set).sort();
  }

  function switchTab(n){
    document.getElementById('tabPage2').classList.toggle('active', n===2);
    document.getElementById('tabPage3').classList.toggle('active', n===3);
    document.getElementById('tabPage4').classList.toggle('active', n===4);
    if (n === 2) renderSelectDropdown();
    if (n === 3) renderHistoryList();
    if (n === 4) renderTrendList();
  }

  /* ---------- TAB 1: Price list management ---------- */
  function addToPriceList(){
    const name = document.getElementById('itemName').value.trim();
    const unit = document.getElementById('itemUnit').value;
    const price = parseFloat(document.getElementById('itemPrice').value);
    const category = selectedItemCategory || DEFAULT_CAT;

    if (!name){ alert('জিনিসের নাম লিখুন'); return; }
    if (isNaN(price) || price < 0){ alert('সঠিক দাম লিখুন'); return; }

    priceList[name] = { unit, price, category };
    savePriceList();
    recordPriceHistory(name, price);
    renderPriceList();
    queuePushToSheet();

    document.getElementById('itemName').value = '';
    document.getElementById('itemPrice').value = '';
    selectedItemCategory = '';
    updateItemCategoryBtnLabel();
    document.getElementById('itemName').focus();
  }

  function updateItemCategoryBtnLabel(){
    const label = document.getElementById('itemCategoryBtnLabel');
    if (!label) return;
    if (selectedItemCategory){
      label.textContent = selectedItemCategory;
      label.classList.add('chosen');
    } else {
      label.textContent = 'ক্যাটাগরি';
      label.classList.remove('chosen');
    }
  }

  function openCategoryPicker(fromShop){
    categoryPickerFromShop = !!fromShop;
    const overlay = document.getElementById('categoryPickerModal');
    const newCatInput = document.getElementById('newCategoryInput');
    newCatInput.value = '';
    renderCategoryPickerList();
    overlay.classList.add('open');
    document.body.classList.add('no-scroll');
    // no .focus() here on purpose — keyboard should only open once the user taps the input
  }

  function closeCategoryPicker(){
    document.getElementById('categoryPickerModal').classList.remove('open');
    document.body.classList.remove('no-scroll');
  }

  function renderCategoryPickerList(){
    const list = document.getElementById('categoryPickerList');
    const cats = getCategories();
    const activeCat = categoryPickerFromShop ? shopFilterCat : selectedItemCategory;

    if (cats.length === 0){
      list.innerHTML = `<div class="picker-none">এখনো কোনো ক্যাটাগরি নেই</div>`;
      return;
    }
    list.innerHTML = cats.map(c => {
      const safe = c.replace(/'/g,"\\'");
      const sel = c === activeCat ? ' selected' : '';
      return `<div class="picker-item${sel}" onclick="pickCategory('${safe}')">
        <span class="nm">${c}</span>
        <button type="button" class="cat-del-btn" title="ক্যাটাগরি মুছুন" onclick="event.stopPropagation(); deleteCategory('${safe}')">✕</button>
      </div>`;
    }).join('');
  }

  function deleteCategory(name){
    if (!confirm(`"${name}" ক্যাটাগরি মুছে ফেলতে চান? এই ক্যাটাগরির জিনিসগুলো "${DEFAULT_CAT}"-এ চলে যাবে।`)) return;

    savePriceList();
    saveCategoryList();
    queuePushToSheet();

    if (selectedItemCategory === name){ selectedItemCategory = ''; updateItemCategoryBtnLabel(); }
    if (priceFilterCat === name){ priceFilterCat = 'সব'; }
    if (trendFilterCat === name){ trendFilterCat = 'সব'; }
    if (shopFilterCat === name){ shopFilterCat = 'সব'; }

    renderCategoryPickerList();
    renderPriceList();
    renderTrendList();
    renderSelectDropdown();

  function cssId(name){
    return name.replace(/[^a-zA-Z0-9\u0980-\u09FF]/g, '_');
  }

  function toggleTrend(name){
    const panel = document.getElementById('trend-' + cssId(name));
    if (!panel) return;
    const isOpen = panel.style.display !== 'none';
    if (isOpen){
      panel.style.display = 'none';
      panel.innerHTML = '';
      return;
    }
    panel.style.display = 'block';
    panel.innerHTML = buildTrendHTML(name);
  }

  function buildTrendHTML(name, histOverride){
    const hist = histOverride || priceHistory[name] || [];
    if (hist.length < 2){
      return `<div class="empty-note" style="padding:4px 0;">
        এখনো যথেষ্ট তথ্য নেই — দাম আরও একবার বদলালে (বা কয়েকদিন পর) এখানে ট্রেন্ড গ্রাফ দেখা যাবে।
      </div>`;
    }

    const w = 560, h = 300, padL = 46, padR = 16, padT = 18, padB = 34;
    const prices = hist.map(p => p.price);
    const minP = Math.min(...prices), maxP = Math.max(...prices);
    const range = (maxP - minP) || 1;

    const xStep = (w - padL - padR) / (hist.length - 1);
    const points = hist.map((p, i) => {
      const x = padL + i * xStep;
      const y = padT + (h - padT - padB) * (1 - (p.price - minP) / range);
      return { x, y, ...p };
    });

    const linePath = points.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');
    const dots = points.map(p =>
      `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4.5" fill="#1B4332"></circle>`
    ).join('');
    const firstLabel = points[0];
    const lastLabel = points[points.length - 1];

    const first = hist[0].price, last = hist[hist.length - 1].price;
    const diff = last - first;
    const pct = first !== 0 ? (diff / first * 100) : 0;
    const trendClass = diff > 0 ? 'up' : (diff < 0 ? 'down' : '');
    const arrow = diff > 0 ? '▲' : (diff < 0 ? '▼' : '—');

    return `
      <svg viewBox="0 0 ${w} ${h}" class="trend-chart-svg" style="width:100%; height:auto; display:block;">
        <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${h-padB}" stroke="#D8CBA3" stroke-width="1.4"/>
        <line x1="${padL}" y1="${h-padB}" x2="${w-padR}" y2="${h-padB}" stroke="#D8CBA3" stroke-width="1.4"/>
        <text x="4" y="${padT+10}" font-size="15" fill="#5b6b58">৳${fmt(maxP)}</text>
        <text x="4" y="${h-padB}" font-size="15" fill="#5b6b58">৳${fmt(minP)}</text>
        <path d="${linePath}" fill="none" stroke="#2D6A4F" stroke-width="3"/>
        ${dots}
        <text x="${firstLabel.x}" y="${h-10}" font-size="13" fill="#7a8a76" text-anchor="start">${firstLabel.date}${firstLabel.time ? ' '+firstLabel.time : ''}</text>
        <text x="${lastLabel.x}" y="${h-10}" font-size="13" fill="#7a8a76" text-anchor="end">${lastLabel.date}${lastLabel.time ? ' '+lastLabel.time : ''}</text>
      </svg>
      <div class="trend-summary">
        <span>প্রথম দাম: ৳${fmt(first)} (${hist[0].date}${hist[0].time ? ' '+hist[0].time : ''})</span>
        <span>এখনকার দাম: ৳${fmt(last)}</span>
        <span class="${trendClass}">${arrow} ${Math.abs(pct).toFixed(1)}%</span>
      </div>
    `;
  }

  function setTrendCatFilter(cat){
    trendFilterCat = cat;
    renderTrendList();
  }

  function setTrendSortMode(mode){
    trendSortMode = mode;
    renderTrendList();
  }

  function setTrendTimeRange(range){
    trendTimeRange = range;
    renderTrendList();
  }

  function filterHistoryByRange(hist, range){
    if (range === 'all' || !hist.length) return hist;
    const daysMap = { today: 0, '7': 7, '30': 30, '90': 90 };
    const days = daysMap.hasOwnProperty(range) ? daysMap[range] : 90;
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - days);
    const cutoffISO = cutoff.toISOString().slice(0, 10);
    return hist.filter(p => p.date >= cutoffISO);
  }

  function getFilteredHist(name){
    return filterHistoryByRange(priceHistory[name] || [], trendTimeRange);
  }

  function getTrendPct(name, histOverride){
    const hist = histOverride || priceHistory[name] || [];
    if (hist.length < 2) return null;
    const first = hist[0].price, last = hist[hist.length - 1].price;
    const diff = last - first;
    const pct = first !== 0 ? (diff / first * 100) : 0;
    return { first, last, diff, pct };
  }

  /* Phase 4 — টপ মুভার্স ক্যালকুলেশন (ডেটা লজিক শুধু; UI Phase 5-এ বসবে)
     সব আইটেম ঘুরে, বর্তমান টাইম-রেঞ্জ ফিল্টার (trendTimeRange) অনুযায়ী history নিয়ে
     % পরিবর্তন হিসাব করে, সবচেয়ে বেশি ওঠানামা (উপরে বা নিচে, দুটোই) হওয়া আইটেমগুলো
     abs(%) অনুযায়ী সাজিয়ে টপ N (ডিফল্ট ৪টা) রিটার্ন করে। */
  function getTopMovers(count){
    const n = count || 4;
    const movers = Object.keys(priceList).map(name => {
      const hist = getFilteredHist(name);
      const info = getTrendPct(name, hist);
      if (!info) return null;
      return {
        name,
        unit: priceList[name] ? priceList[name].unit : '',
        first: info.first,
        last: info.last,
        diff: info.diff,
        pct: info.pct
      };
    }).filter(Boolean);

    movers.sort((a, b) => Math.abs(b.pct) - Math.abs(a.pct));
    return movers.slice(0, n);
  }

  function renderTopMovers(){
    const box = document.getElementById('trendTopMoversBox');
    if (!box) return;
    const movers = getTopMovers(4);
    if (movers.length === 0){
      box.innerHTML = '';
      return;
    }
    box.innerHTML = `<div class="mover-cards">` + movers.map(m => {
      const safeKey = m.name.replace(/'/g, "\\'");
      const dirClass = m.diff > 0 ? 'up' : (m.diff < 0 ? 'down' : '');
      const arrow = m.diff > 0 ? '▲' : (m.diff < 0 ? '▼' : '—');
      return `<button type="button" class="mover-card" onclick="scrollToMoverItem('${safeKey}')">
        <span class="mover-fire">🔥</span>
        <span class="mover-nm">${m.name}</span>
        <span class="mover-pct ${dirClass}">${arrow} ${Math.abs(m.pct).toFixed(1)}%</span>
        <div class="mover-price">৳${fmt(m.first)} → ৳${fmt(m.last)}</div>
      </button>`;
    }).join('') + `</div>`;
  }

  function scrollToMoverItem(name){
    trendFilterCat = 'সব';
    const searchInput = document.getElementById('trendSearchInput');
    if (searchInput) searchInput.value = '';
    renderTrendList();
    const panel = document.getElementById('trend2-' + cssId(name));
    if (!panel) return;
    toggleTrend2(name);
    const row = panel.closest('.plist-row');
    if (row && row.scrollIntoView) row.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function renderTrendSortChips(){
    const box = document.getElementById('trendSortChips');
    if (!box) return;
    const opts = [
      { mode: 'name', label: 'নাম অনুযায়ী' },
      { mode: 'up', label: '▲ সবচেয়ে বেশি বেড়েছে' },
      { mode: 'down', label: '▼ সবচেয়ে বেশি কমেছে' }
    ];
    box.innerHTML = opts.map(o =>
      `<button type="button" class="cat-chip${trendSortMode === o.mode ? ' active' : ''}" onclick="setTrendSortMode('${o.mode}')">${o.label}</button>`
    ).join('');
  }

  function renderTrendRangeChips(){
    const box = document.getElementById('trendRangeChips');
    if (!box) return;
    const opts = [
      { range: 'all', label: 'সব সময়' },
      { range: 'today', label: 'আজকের দিন' },
      { range: '7', label: '১ সপ্তাহ' },
      { range: '30', label: 'গত ৩০ দিন' },
      { range: '90', label: 'গত ৯০ দিন' }
    ];
    box.innerHTML = opts.map(o =>
      `<button type="button" class="cat-chip${trendTimeRange === o.range ? ' active' : ''}" onclick="setTrendTimeRange('${o.range}')">${o.label}</button>`
    ).join('');
  }

  function renderTrendList(){
    const box = document.getElementById('trendListBox');
    if (!box) return;
    renderTopMovers();
    renderCatChips('trendCatChips', trendFilterCat, 'setTrendCatFilter');
    renderTrendSortChips();
    renderTrendRangeChips();

    const q = (document.getElementById('trendSearchInput')?.value || '').trim().toLowerCase();

    let keys = Object.keys(priceList).sort();
    if (trendFilterCat !== 'সব'){
      keys = keys.filter(k => (priceList[k].category || DEFAULT_CAT) === trendFilterCat);
    }
    if (q) keys = keys.filter(k => k.toLowerCase().includes(q));

    if (trendSortMode === 'up' || trendSortMode === 'down'){
      const withPct = keys.filter(k => getTrendPct(k, getFilteredHist(k)) !== null);
      const withoutPct = keys.filter(k => getTrendPct(k, getFilteredHist(k)) === null);
      withPct.sort((a, b) => {
        const pa = getTrendPct(a, getFilteredHist(a)).pct, pb = getTrendPct(b, getFilteredHist(b)).pct;
        return trendSortMode === 'up' ? (pb - pa) : (pa - pb);
      });
      keys = withPct.concat(withoutPct);
    }

    if (Object.keys(priceList).length === 0){
      box.innerHTML = `<div class="empty-note">এখনো কোনো জিনিস সেভ করা নেই</div>`;
      return;
    }
    if (keys.length === 0){
      box.innerHTML = `<div class="empty-note">এই ফিল্টারে কিছু পাওয়া যায়নি</div>`;
      return;
    }

    box.innerHTML = keys.map(k => {
      const it = priceList[k];
      const safeKey = k.replace(/'/g,"\\'");
      const trendInfo = getTrendPct(k, getFilteredHist(k));
      let badge = '';
      if (trendInfo){
        const { diff, pct } = trendInfo;
        const cls = diff > 0 ? 'trend-pct-up' : (diff < 0 ? 'trend-pct-down' : 'trend-pct-flat');
        const arrow = diff > 0 ? '▲' : (diff < 0 ? '▼' : '—');
        badge = `<span class="${cls}">${arrow} ${Math.abs(pct).toFixed(1)}%</span>`;
      }
      return `<div class="plist-row">
        <div class="plist-item" style="cursor:pointer;" onclick="toggleTrend2('${safeKey}')">
          <span class="nm">${k} <span style="color:#9a9a86; font-weight:400;">(${it.unit})</span></span>
          <span style="display:flex; align-items:center; gap:10px;">
            <span class="pr" style="cursor:default; border-bottom:none;">৳${fmt(it.price)}</span>
            ${badge}
          </span>
        </div>
        <div class="trend-panel" id="trend2-${cssId(k)}" style="display:none;"></div>
      </div>`;
    }).join('');
  }

  function toggleTrend2(name){
    const panel = document.getElementById('trend2-' + cssId(name));
    if (!panel) return;
    const isOpen = panel.style.display !== 'none';
    if (isOpen){
      panel.style.display = 'none';
      panel.innerHTML = '';
      return;
    }
    panel.style.display = 'block';
    panel.innerHTML = buildTrendHTML(name, getFilteredHist(name));
  }

  function editPrice(name){
    const view = document.getElementById('prView-' + cssId(name));
    if (!view) return;
    const current = priceList[name].price;
    view.outerHTML = `<input type="number" min="0" step="0.01" class="pr-edit" id="prEdit-${cssId(name)}"
        value="${current}"
        onblur="saveEditedPrice('${name.replace(/'/g,"\\'")}')"
        onkeydown="if(event.key==='Enter'){this.blur();}">`;
    const input = document.getElementById('prEdit-' + cssId(name));
    input.focus();
    input.select();
  }

  function saveEditedPrice(name){
    const input = document.getElementById('prEdit-' + cssId(name));
    if (!input) return;
    const newPrice = parseFloat(input.value);
    if (!isNaN(newPrice) && newPrice >= 0){
      priceList[name].price = newPrice;
      savePriceList();
      recordPriceHistory(name, newPrice);
      queuePushToSheet();
    }
    renderPriceList();
    renderSelectDropdown();
  }

  /* ---------- TAB 2: Select one item at a time, then add ---------- */
  let selectedShopItem = ''; // currently chosen item name (from search dropdown)
  let shopItemKeys = [];     // items available under current category filter
  let selectQtyUnitMode = 'base'; // 'base' | 'gram' — toggles the quantity entry unit when the item's base unit is কেজি


  function setShopCatFilter(cat){
    shopFilterCat = cat;
    renderSelectDropdown();
  }

  function setItemPickerCatFilter(cat){
    shopFilterCat = cat;
    renderSelectDropdown();
    renderCatChips('itemPickerCatChips', shopFilterCat, 'setItemPickerCatFilter', 'openCategoryPicker(true)');
    renderPickerList();
  }

  function renderSelectDropdown(){
    const emptyNote = document.getElementById('shopEmptyNote');

    let keys = Object.keys(priceList).sort();
    if (shopFilterCat !== 'সব'){
      keys = keys.filter(k => (priceList[k].category || DEFAULT_CAT) === shopFilterCat);
    }
    shopItemKeys = keys;

    if (Object.keys(priceList).length === 0){
      emptyNote.textContent = 'এখনো কোনো জিনিস সেভ করা নেই। আগে "প্রাইস লিস্ট" ট্যাবে গিয়ে জিনিস যোগ করুন।';
      emptyNote.style.display = 'block';
    } else if (keys.length === 0){
      emptyNote.textContent = 'এই ক্যাটাগরিতে কিছু নেই';
      emptyNote.style.display = 'block';
    } else {
      emptyNote.style.display = 'none';
    }

    // if the previously selected item fell out of the current filter, clear it
    if (selectedShopItem && !keys.includes(selectedShopItem)){
      selectedShopItem = '';
      selectQtyUnitMode = 'base';
    }
    updateSelectItemBtnLabel();
    onSelectItemChange();
  }

  function getQtyUnitBadgeInfo(name){
    if (!name || !priceList[name]) return { toggleable: false, label: 'একক', factor: 1 };
    const it = priceList[name];
    if (it.unit === 'কেজি'){
      return {
        toggleable: true,
        label: selectQtyUnitMode === 'gram' ? 'গ্রাম' : 'কেজি',
        factor: selectQtyUnitMode === 'gram' ? 0.001 : 1
      };
    }
    return { toggleable: false, label: it.unit, factor: 1 };
  }

  function toggleSelectQtyUnit(){
    const name = selectedShopItem;
    const info = getQtyUnitBadgeInfo(name);
    if (!info.toggleable) return;
    selectQtyUnitMode = (selectQtyUnitMode === 'gram') ? 'base' : 'gram';
    updateSelectItemBtnLabel();
    const qtyInput = document.getElementById('selectQty');
    if (qtyInput){
      qtyInput.placeholder = `${getQtyUnitBadgeInfo(name).label} লিখুন`;
    }
    updateLivePreview();
  }

  function updateSelectItemBtnLabel(){
    const label = document.getElementById('selectItemBtnLabel');
    if (!label) return;
    const unitBadge = document.getElementById('selectUnitBadge');
    if (selectedShopItem && priceList[selectedShopItem]){
      label.textContent = selectedShopItem;
      label.classList.add('chosen');
      if (unitBadge){
        const info = getQtyUnitBadgeInfo(selectedShopItem);
        unitBadge.textContent = info.label;
        unitBadge.classList.add('chosen');
        unitBadge.classList.toggle('toggleable', info.toggleable);
        unitBadge.title = info.toggleable ? 'ক্লিক করে কেজি/গ্রাম বদলান' : '';
      }
    } else {
      label.textContent = 'জিনিস সিলেক্ট করুন';
      label.classList.remove('chosen');
      if (unitBadge){
        unitBadge.textContent = 'একক';
        unitBadge.classList.remove('chosen');
        unitBadge.classList.remove('toggleable');
        unitBadge.title = '';
      }
    }
  }

  function openItemPicker(){
    const overlay = document.getElementById('itemPickerModal');
    const search = document.getElementById('pickerSearchInput');
    search.value = '';
    document.getElementById('pickerNewItemUnit').value = 'কেজি';
    document.getElementById('pickerNewItemPrice').value = '';
    closePickerItemMenu();
    renderCatChips('itemPickerCatChips', shopFilterCat, 'setItemPickerCatFilter', 'openCategoryPicker(true)');
    renderPickerList();
    overlay.classList.add('open');
    document.body.classList.add('no-scroll');
    // no .focus() here on purpose — keyboard should only open once the user taps the search box
  }

  function closeItemPicker(){
    document.getElementById('itemPickerModal').classList.remove('open');
    document.body.classList.remove('no-scroll');
    closePickerItemMenu();
  }

  function renderPickerList(){
    const list = document.getElementById('pickerList');
    const query = document.getElementById('pickerSearchInput').value.trim().toLowerCase();
    const matches = query
      ? shopItemKeys.filter(k => k.toLowerCase().includes(query))
      : shopItemKeys;

    if (matches.length === 0){
      list.innerHTML = `<div class="picker-none">কোনো জিনিস পাওয়া যায়নি</div>`;
      return;
    }
    list.innerHTML = matches.map(k => {
      const it = priceList[k];
      const safe = k.replace(/'/g,"\\'");
      const sel = k === selectedShopItem ? ' selected' : '';

  function renderPickerItemMenuPopup(){

      </div>

  function positionPickerPopup(popup, btnEl){
    const rect = btnEl.getBoundingClientRect();
    const margin = 8;
    popup.style.visibility = 'hidden';
    popup.style.display = 'block';
    const pw = popup.offsetWidth;
    const ph = popup.offsetHeight;
    let left = rect.right - pw;
    if (left < margin) left = margin;
    if (left + pw > window.innerWidth - margin) left = window.innerWidth - pw - margin;
    let top = rect.bottom + 4;
    if (top + ph > window.innerHeight - margin){
      top = rect.top - ph - 4;
      if (top < margin) top = margin;
    }
    popup.style.left = left + 'px';
    popup.style.top = top + 'px';
    popup.style.visibility = 'visible';
  }

  document.addEventListener('click', function(e){
    const popup = document.getElementById('pickerItemMenuPopup');
    if (!popup || popup.style.display === 'none') return;
    if (!popup.contains(e.target)) closePickerItemMenu();

  function deleteFromPickerList(name){
    deleteFromPriceList(name);
    if (pickerOpenMenuKey === name) closePickerItemMenu();
    renderPickerList();

  // Editing একক/দাম inside the popup only stages the change in the input/select.
  // Nothing is saved to priceList or re-rendered until "সেভ" is tapped —
  // this keeps the popup's DOM (and its anchor button) untouched, so its position stays fixed.
  function editPickerUnitPopup(name){
    const view = document.getElementById('popupUnitVal');
    if (!view || !priceList[name]) return;
    const current = priceList[name].unit;
    const units = ['কেজি','লিটার','পিস','ডজন','গ্রাম','প্যাকেট','পাতা','টাকা'];
    const options = units.map(u => `<option value="${u}"${u===current?' selected':''}>${u}</option>`).join('');
    view.outerHTML = `<select class="pr-edit-unit" id="popupUnitEdit" onclick="event.stopPropagation()">${options}</select>`;
    const sel = document.getElementById('popupUnitEdit');
    sel.focus();
    if (sel.showPicker){ try{ sel.showPicker(); }catch(e){} }
    positionPickerPopup(document.getElementById('pickerItemMenuPopup'), pickerMenuBtnEl);
  }

  function editPickerPricePopup(name){
    const view = document.getElementById('popupPriceVal');
    if (!view || !priceList[name]) return;
    const current = priceList[name].price;
    view.outerHTML = `<input type="number" min="0" step="0.01" class="pr-edit" id="popupPriceEdit"
        value="${current}"
        onclick="event.stopPropagation()"
        onkeydown="if(event.key==='Enter'){event.stopPropagation(); savePopupChanges('${name.replace(/'/g,"\\'")}');}">`;
    const input = document.getElementById('popupPriceEdit');
    input.focus();
    input.select();
    positionPickerPopup(document.getElementById('pickerItemMenuPopup'), pickerMenuBtnEl);

  // Commits any staged একক/দাম edits and closes the popup.
  function savePopupChanges(name){
    if (!priceList[name]){ closePickerItemMenu(); return; }
    const unitSel = document.getElementById('popupUnitEdit');
    if (unitSel){
      priceList[name].unit = unitSel.value;
    }
    const priceInput = document.getElementById('popupPriceEdit');
    if (priceInput){
      const newPrice = parseFloat(priceInput.value);
      if (!isNaN(newPrice) && newPrice >= 0){
        priceList[name].price = newPrice;
        recordPriceHistory(name, newPrice);
      }
    }
    savePriceList();
    queuePushToSheet();
    renderPickerList();
    renderPriceList();
    renderSelectDropdown();
    closePickerItemMenu();

  function updateLivePreview(){
    const name = selectedShopItem;
    const preview = document.getElementById('selectPreview');
    if (!name || !priceList[name]) return;
    const it = priceList[name];
    const info = getQtyUnitBadgeInfo(name);
    const qty = parseFloat(document.getElementById('selectQty').value);
    if (!isNaN(qty) && qty > 0){
      const baseQty = qty * info.factor;
      const total = baseQty * it.price;
      if (info.factor !== 1){
        preview.textContent = `${qty} ${info.label} (= ${fmt(baseQty)} ${it.unit}) x ৳${fmt(it.price)} = ৳${fmt(total)}`;
      } else {
        preview.textContent = `${qty} ${info.label} x ৳${fmt(it.price)} = ৳${fmt(total)}`;
      }

    const name = selectedShopItem;
    const qtyInput = document.getElementById('selectQty');
    const qty = parseFloat(qtyInput.value);
    const otherInput = document.getElementById('otherItemInput');
    const otherText = otherInput.value.trim();

  function groupCartByCategory(){
    const names = Object.keys(quantities).filter(n => priceList[n]);
    const byCategory = {};
    names.forEach(n => {
      const cat = priceList[n].category || DEFAULT_CAT;
      if (!byCategory[cat]) byCategory[cat] = [];
      byCategory[cat].push(n);
    });
    Object.keys(byCategory).forEach(cat => byCategory[cat].sort());
    return byCategory;
  }

  function sortCatsOtherLast(cats){
    return cats.sort((a, b) => {
      if (a === 'অন্যান্য' && b === 'অন্যান্য') return 0;
      if (a === 'অন্যান্য') return 1;
      if (b === 'অন্যান্য') return -1;
      return a.localeCompare(b);
    });
  }

  function saveCartToHistory(){
    const byCategory = groupCartByCategory();
    const cats = sortCatsOtherLast(Object.keys(byCategory));
    if (cats.length === 0 && otherItems.length === 0) return;

    let grand = 0;
    const categories = cats.map(cat => {
      let catTotal = 0;
      const items = byCategory[cat].map(n => {
        const it = priceList[n];
        const qty = quantities[n];
        const sub = qty * it.price;
        catTotal += sub;
        grand += sub;
        const disp = getDisplayQtyUnit(qty, it.unit);
        return { name:n, qty: disp.qty, unit: disp.unit, price:it.price, sub };
      });
      return { category:cat, catTotal, items };
    });

    if (otherItems.length > 0){
      categories.push({
        category: 'অন্যান্য (দাম ছাড়া)',
        catTotal: 0,
        items: otherItems.map(o => ({ name:o.text, qty:'', unit:'', price:0, sub:0 }))
      });

    const entry = {
      id: Date.now(),
      dateLabel: new Date().toLocaleString('bn-BD', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }),
      grand,
      categories

    renderHistoryList();
    queuePushToSheet();

  function copyTextToClipboard(text){
    return new Promise((resolve, reject) => {
      const tryFallback = () => {
        try{
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.top = '0';
          ta.style.left = '-9999px';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          ta.setSelectionRange(0, text.length);
          const ok = document.execCommand('copy');
          document.body.removeChild(ta);
          ok ? resolve() : reject(new Error('execCommand copy failed'));
        } catch(e){
          reject(e);
        }
      };

      if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext){
        navigator.clipboard.writeText(text).then(resolve).catch(tryFallback);
      } else {
        tryFallback();
      }
    });
  }

    if (!btn) return;
    if (!btn.dataset.originalLabel) btn.dataset.originalLabel = btn.innerHTML;

    btn.innerHTML = tempText;
    btn._flashTimer = setTimeout(() => {
      btn.innerHTML = btn.dataset.originalLabel;
      btn._flashTimer = null;
    }, duration || 1400);
  }

    setSyncStatus('⬇️ শিট থেকে আনা হচ্ছে...', 'busy');
    pullFromSheet(false);
  } else {
    setSyncStatus('🔌 সিঙ্ক সেট করা নেই', '');
  }

  // Service worker রেজিস্টার করা — এটাই অ্যাপটাকে (HTML/CSS/JS/icons) অফলাইনে
  // খোলা ও চালানোর ক্ষমতা দেয়। ডেটা (priceList/priceHistory/shoppingLog) এমনিতেই
  // localStorage-এ থাকে, তাই সেটার জন্য আলাদা কিছু লাগে না।
  if ('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch((err) => {
        console.error('Service worker registration failed:', err);
      });
    });
  }
</script>
</body>
</html>
